[project]
name = "dio-blog"
version = "0.1.0"
description = ""
authors = [{ name = "Victor Guiraldelli", email = "vguiraldelli@outlook.com" }]
# Se você não quiser mover o arquivo README para dentro desta pasta, 
# você pode comentar ou remover a linha abaixo:
# readme = "README.md" 
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard] (>=0.45.0,<0.46.0)",
    "databases[aiosql,asyncpg]",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "psycopg2-binary",
    "asyncpg (>=0.31.0,<0.32.0)",
]

[tool.poetry]
package-mode = false # <--- AGORA VAI FUNCIONAR AQUI

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
