[project]
name = "dio-blog"
version = "0.1.0"
description = ""
authors = [{ name = "Victor Guiraldelli", email = "vguiraldelli@outlook.com" }]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard] (>=0.45.0,<0.46.0)",
    "databases[aiosqlite] (>=0.9.0,<0.10.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
